<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sweatmate · unsubscribe</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 512 512%22%3E%3Cdefs%3E%3ClinearGradient id=%22a%22 x1=%220%22 y1=%220%22 x2=%220%22 y2=%221%22%3E%3Cstop offset=%220%22 stop-color=%22%23F09A1F%22/%3E%3Cstop offset=%221%22 stop-color=%22%23D97706%22/%3E%3C/linearGradient%3E%3ClinearGradient id=%22b%22 x1=%220%22 y1=%220%22 x2=%220%22 y2=%221%22%3E%3Cstop offset=%220%22 stop-color=%22%23D97706%22/%3E%3Cstop offset=%221%22 stop-color=%22%23B45309%22/%3E%3C/linearGradient%3E%3CclipPath id=%22c%22%3E%3Ccircle cx=%22196%22 cy=%22216%22 r=%22170%22/%3E%3C/clipPath%3E%3C/defs%3E%3Ccircle cx=%22196%22 cy=%22216%22 r=%22170%22 fill=%22url(%23a)%22/%3E%3Ccircle cx=%22361%22 cy=%22341%22 r=%22115%22 fill=%22url(%23b)%22/%3E%3Ccircle cx=%22361%22 cy=%22341%22 r=%22115%22 fill=%22%238F4A05%22 clip-path=%22url(%23c)%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<style>
  .card{max-width:460px; margin:70px auto; background:#fff; border-radius:24px; padding:40px 32px;
        box-shadow:0 8px 30px rgba(0,0,0,.06); text-align:center;}
  .card .logo{width:56px;height:56px;border-radius:14px;margin:0 auto 18px;display:block}
  .card h1{font-size:24px;margin-bottom:10px}
  .card p{color:var(--grey);font-size:16px}
  .card .btn{margin-top:22px}
  .card a.home{display:inline-block;margin-top:18px;color:var(--amber-lo);font-weight:600;font-size:15px}
</style>
</head>
<body>
<div class="card">
  <img class="logo" src="email-logo.png" alt="sweatmate">
  <div id="body">
    <h1>unsubscribe</h1>
    <p id="msg">one tap and you’re off the sweatmate beta list.</p>
    <button class="btn" id="go" type="button">unsubscribe me</button>
    <div><a class="home" href="/">back to sweatmate</a></div>
  </div>
</div>
<script>
  const SB_URL = "https://uudccbzihhgoeaevkewr.supabase.co";
  const SB_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV1ZGNjYnppaGhnb2VhZXZrZXdyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzNzk0NzEsImV4cCI6MjEwMTk1NTQ3MX0.OHJC3vmT8eRLczFkH0QdZybbjudDfSi4VEX8Mc22ABQ";
  const params = new URLSearchParams(location.search);
  const token = params.get("t");
  const msg = document.getElementById("msg");
  const btn = document.getElementById("go");

  if(!token){ btn.style.display="none"; msg.textContent = "this link is missing its code. open the unsubscribe link from your email."; }

  btn.addEventListener("click", async () => {
    btn.disabled = true; msg.textContent = "…";
    try{
      const r = await fetch(SB_URL + "/rest/v1/rpc/unsubscribe_beta", {
        method:"POST",
        headers:{"apikey":SB_ANON,"Content-Type":"application/json"},
        body: JSON.stringify({p_token: token})
      });
      const out = await r.json().catch(()=>null);
      if(r.ok && out === "ok"){
        document.querySelector("h1").textContent = "you’re unsubscribed";
        msg.textContent = "you won’t hear from the sweatmate beta again. no hard feelings 🟠";
        btn.style.display="none";
      } else if(r.ok && out === "notfound"){
        msg.textContent = "this link isn’t valid anymore. you may already be unsubscribed.";
        btn.style.display="none";
      } else {
        msg.textContent = "something went wrong, try again in a moment."; btn.disabled=false;
      }
    }catch(_){ msg.textContent = "couldn’t reach the server, try again."; btn.disabled=false; }
  });
</script>
</body>
</html>
